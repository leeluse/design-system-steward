<!DOCTYPE html>
<html lang="en">
<!-- ============================================================
  archive.html — UI Steward archive app
============================================================ -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design System Steward</title>
  <link rel="stylesheet" href="archive.css" />
</head>

<body>
  <script>
    (function () {
      const theme = localStorage.getItem("theme") || "light";
      if (theme === "dark") {
        document.body.classList.add("dark");
      }
    })();
  </script>
  <div class="app">
    <!-- Left: Workspaces / Components list -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <strong>Design System Steward</strong>
        <div class="sidebar-actions">
          <span class="count" id="count"></span>
          <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </div>
      <input class="search" id="search" type="text" placeholder="Search..." />
      <nav class="list" id="list"></nav>
    </aside>

    <!-- Center: Preview canvas -->
    <main class="stage">
      <div class="stage-head">
        <h1 id="comp-name">—</h1>
        <span class="badge" id="comp-status"></span>
        <span class="hint">Alt+Hover = Measure · Drag = Pan · Ctrl+Scroll = Zoom</span>
      </div>
      <div class="canvas" id="canvas">
        <div class="canvas-inner" id="canvas-inner"></div>
      </div>
    </main>

    <!-- Right: Spec (colors / size / spacing) -->
    <aside class="inspect" id="inspect"></aside>
  </div>

  <script src="archive.js"></script>
  <script src="components.js"></script>
</body>

</html>
